description: >
  Tutorial companion site for MAQC 2026 session P06, "Publishing Reusable AI/ML
  Models in the Life Sciences". Covers the DOME recommendations for reporting
  supervised machine learning in biology, the DOME Registry, DOME Copilot, the
  Open and Sustainable AI (OSAI) recommendations, and three practical routes to
  producing a DOME transparency report: manual annotation, LLM-assisted
  annotation with DOME Copilot, and agentic annotation with the DOME Agent Skill.
keywords: DOME, OSAI, machine learning, reporting standards, transparency, reproducibility, FAIR, ELIXIR, MAQC, AI registries
